<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Formularz Rezerwacji</title>
    <style>
        body{
            background-image: url('reception.jpg');

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        form {
            display: flex;
            flex-direction: column;
            max-width: 300px;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h2>Formularz</h2>

    <form id="Formularz">
        <label>Imię:</label>
        <input 
            type="text"
            id="first_name"
            placeholder="np. Jan"
            pattern="[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+" 
            title="Imię może zawierać tylko litery."
            required>

        <label>Drugie imię (pole opcjonalne):</label>
        <input 
            type="text" 
            id="middle_name" 
            placeholder="np. Paweł"
            pattern="[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+" 
            title="Drugie imię może zawierać tylko litery.">

        <label>Nazwisko:</label>
        <input 
            type="text" 
            id="last_name" 
            placeholder="np. Adamczewski" 
            pattern="[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+(-[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]+)?" 
            title="Nazwisko może składać się tylko z liter oraz opcjonalnie drugiego członu po myślniku."
            required>

        <label>Data:</label>
        <input type="date" id="date" required>

        <label>Numer telefonu:</label>
        <input 
            type="tel" 
            id="phone_number" 
            placeholder="np. 123456789" 
            pattern="[0-9]{9}" 
            maxlength="9"
            title="Numer telefonu musi składać się z dokładnie 9 cyfr."
            required>

        <label>e-mail:</label>
        <input type="email" id="e-mail" placeholder="np. adres@email.pl" required>

        <button type="submit">Wyślij</button>
    </form>
    <script>
        //Ustawienie minimalnej daty rezerwacji
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        //Obsługa wysłania formularza i eksportu danych do pliku JSON
        document.getElementById('Formularz').addEventListener('submit', function(e) {
            e.preventDefault(); // Zatrzymuje domyślne przeładowanie strony

            // Tworzymy obiekt JavaScript z danymi pobranymi z pól formularza
            const daneRezerwacji = {
                firstName: document.getElementById('first_name').value,
                middleName: document.getElementById('middle_name').value || null,
                lastName: document.getElementById('last_name').value,
                reservationDate: document.getElementById('date').value,
                phoneNumber: document.getElementById('phone_number').value,
                email: document.getElementById('e-mail').value
            };

            // Zamieniamy obiekt na sformatowany tekst JSON
            const jsonString = JSON.stringify(daneRezerwacji, null, 2);

            // Tworzymy wirtualny plik w pamięci przeglądarki
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            // Tworzymy element <a> wymuszający pobranie pliku
            const link = document.createElement('a');
            link.href = url;
            link.download = 'rezerwacja.json';
            link.click();

            // Czyszczenie zasobów URL
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
